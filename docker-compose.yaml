services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: cloud-bookstore-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit-data:/data

volumes:
  mailpit-data:

minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cloudian
      MINIO_ROOT_PASSWORD: cloudian
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data